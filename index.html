<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長文→スレッド分割ツール</title>
<style>
  :root {
    --bg: #E7F5F3;
    --surface: #FFFFFF;
    --text-main: #1B3A36;
    --text-sub: #4C6D67;
    --accent: #128C7E;
    --danger: #D64550;
    --border: #CFE8E3;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 16px;
  }

  h1 {
    font-size: 18px;
    margin: 0 0 8px 0;
    color: var(--text-main);
  }

  header p {
    font-size: 14px;
    margin: 0;
    color: var(--text-sub);
  }

  .input-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
  }

  textarea {
    width: 100%;
    min-height: 160px;
    font-size: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
    color: var(--text-main);
    background: var(--surface);
  }

  .char-count {
    font-size: 14px;
    color: var(--text-sub);
  }

  button {
    font-size: 14px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 44px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  .split-button {
    background: var(--accent);
    color: #FFFFFF;
    font-weight: bold;
    padding: 0 16px;
  }

  .split-button:hover {
    opacity: 0.9;
  }

  .error-message {
    font-size: 14px;
    color: var(--danger);
  }

  .empty-state {
    font-size: 14px;
    color: var(--text-sub);
    padding: 16px;
  }

  .result-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
  }

  .result-card-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .seq-label {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-main);
  }

  .card-char-count {
    font-size: 14px;
    color: var(--text-sub);
  }

  .copy-button {
    background: var(--accent);
    color: #FFFFFF;
    padding: 0 12px;
    min-width: 72px;
  }

  .copy-button.copied {
    background: var(--text-sub);
  }

  .result-body {
    font-size: 16px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    color: var(--text-main);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>長文→スレッド分割ツール</h1>
    <p>長文を貼り付けると、140字以内のポストに分けて連番を付けます。</p>
  </header>

  <section class="input-section">
    <textarea id="input-text" placeholder="ここに長文を貼り付けてください"></textarea>
    <div class="char-count">全体の文字数: <span id="total-count">0</span>字</div>
    <button type="button" class="split-button" id="split-btn">分割する</button>
    <div class="error-message" id="error-message" style="display: none;">テキストを入力してください</div>
  </section>

  <section id="result-area">
    <div class="empty-state" id="empty-state">テキストを入力して分割してください</div>
    <div class="result-list" id="result-list" style="display: none;"></div>
  </section>
</main>

<script>
  const LIMIT = 140;
  const textInput = document.getElementById('input-text');
  const totalCount = document.getElementById('total-count');
  const splitBtn = document.getElementById('split-btn');
  const errorMessage = document.getElementById('error-message');
  const emptyState = document.getElementById('empty-state');
  const resultList = document.getElementById('result-list');

  textInput.addEventListener('input', () => {
    totalCount.textContent = textInput.value.length;
  });

  function splitText(text) {
    const posts = [];
    let remaining = text;

    while (remaining.length > 0) {
      if (remaining.length <= LIMIT) {
        posts.push(remaining);
        break;
      }

      const windowSlice = remaining.slice(0, LIMIT + 1);
      // 優先順位: 句点(。)・改行のうち140字境界に近い方 > 強制区切り
      let cutIndex = -1;

      const lastPeriod = windowSlice.lastIndexOf('。');
      const lastNewline = windowSlice.lastIndexOf('\n');

      const periodCut = (lastPeriod !== -1 && lastPeriod < LIMIT) ? lastPeriod + 1 : -1;
      const newlineCut = (lastNewline !== -1 && lastNewline < LIMIT) ? lastNewline + 1 : -1;

      cutIndex = Math.max(periodCut, newlineCut);

      if (cutIndex === -1 || cutIndex === 0) {
        // 適切な区切りが見つからない場合は文字数で強制的に区切る
        cutIndex = LIMIT;
      }

      posts.push(remaining.slice(0, cutIndex));
      remaining = remaining.slice(cutIndex);
    }

    return posts;
  }

  function renderResults(posts) {
    resultList.innerHTML = '';

    posts.forEach((post, index) => {
      const card = document.createElement('div');
      card.className = 'result-card';

      const cardHeader = document.createElement('div');
      cardHeader.className = 'result-card-header';

      const seqLabel = document.createElement('span');
      seqLabel.className = 'seq-label';
      seqLabel.textContent = `(${index + 1}/${posts.length})`;

      const charCount = document.createElement('span');
      charCount.className = 'card-char-count';
      charCount.textContent = `${post.length}/${LIMIT}字`;

      const copyButton = document.createElement('button');
      copyButton.type = 'button';
      copyButton.className = 'copy-button';
      copyButton.textContent = 'コピー';
      copyButton.addEventListener('click', () => {
        copyToClipboard(post, copyButton);
      });

      cardHeader.appendChild(seqLabel);
      cardHeader.appendChild(charCount);
      cardHeader.appendChild(copyButton);

      const body = document.createElement('div');
      body.className = 'result-body';
      body.textContent = post;

      card.appendChild(cardHeader);
      card.appendChild(body);
      resultList.appendChild(card);
    });
  }

  function copyToClipboard(text, button) {
    const showCopied = () => {
      const originalText = 'コピー';
      button.textContent = 'コピーしました';
      button.classList.add('copied');
      setTimeout(() => {
        button.textContent = originalText;
        button.classList.remove('copied');
      }, 1500);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied).catch(() => {
        fallbackCopy(text, showCopied);
      });
    } else {
      fallbackCopy(text, showCopied);
    }
  }

  function fallbackCopy(text, onSuccess) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.width = '1px';
    textarea.style.height = '1px';
    textarea.style.opacity = '0';
    textarea.style.overflow = 'hidden';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try {
      document.execCommand('copy');
      onSuccess();
    } catch (e) {
      // コピーに失敗しても画面は壊さない
    }
    document.body.removeChild(textarea);
  }

  splitBtn.addEventListener('click', () => {
    const text = textInput.value;

    if (text.trim().length === 0) {
      errorMessage.style.display = 'block';
      emptyState.style.display = 'block';
      resultList.style.display = 'none';
      resultList.innerHTML = '';
      return;
    }

    errorMessage.style.display = 'none';

    const posts = splitText(text);
    renderResults(posts);

    emptyState.style.display = 'none';
    resultList.style.display = 'flex';
  });
</script>
</body>
</html>
